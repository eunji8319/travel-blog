<!DOCTYPE html>             // HTML5 문서 유형 선언
<html lang="ko">            // 문서의 언어를 한국어로 설정
<head>                      // 문서의 메타데이터를 포함하는 head 요소
  <meta charset="UTF-8">    // 문서의 글자는 UTF-8 인코딩(로 읽어 주세요)을 사용, 한글엔 필수
  <title>eunji_in의 여행 기록</title>
</head> //헤드 요소의 끝
<body>  // 실제로 보이는 내용
  <h1>eunji_in의 기억 저장소</h1>  //heading1 가장 큰 제목, h1~h6까지 있음, 숫자가 커질수록 제목이 작아짐
  <p>곧 진짜 글이 올라올 예정.</p>  // p는 paragraph 문단임, 일반 본문 텍스트 담을 때 사용
</body>
</html>
